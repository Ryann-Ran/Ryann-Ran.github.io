# Publication data source.
#
# To add a paper, copy one item under `items` and edit its fields. File order is
# the display order. `type` must be `preprint` or `publication`; first-author
# papers must set `first_author: true` and provide an image. Define the tag
# hierarchy once in `primary_tags`, then assign papers with `primary_tags` and
# optional `secondary_tags` from that hierarchy.

